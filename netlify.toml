[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Single-page app: any other path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or updates won't reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
